<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>게이지 도안 계산기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --ink:#000000; --canvas:#ffffff; --hairline:#e6e6e6; --hairline-soft:#f1f1f1; --surface-soft:#f7f7f5;
    --lime:#dceeb1; --lilac:#c5b0f4; --cream:#f4ecd6; --pink:#efd4d4; --mint:#c8e6cd; --coral:#f3c9b6; --navy:#1f1d3d;
    --magenta:#ff3d8b; --success:#1ea64a;
    --r-xs:2px; --r-sm:6px; --r-md:8px; --r-lg:24px; --r-pill:50px; --r-full:9999px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--canvas); color:var(--ink); }
  body { font-family:'Pretendard', -apple-system, "Malgun Gothic", sans-serif; }
  .ff-mono { font-family:'Pretendard', monospace; }
  .eyebrow { font-family:'Pretendard', monospace; text-transform:uppercase; font-size:13px; font-weight:400; letter-spacing:0.5px; color:var(--ink); }
  .caption { font-family:'Pretendard', monospace; text-transform:uppercase; font-size:11px; font-weight:400; letter-spacing:0.5px; color:#55524a; }
  .headline { font-size:24px; font-weight:540; line-height:1.3; letter-spacing:-0.2px; }
  .card-title { font-size:17px; font-weight:700; line-height:1.4; }
  .body-sm { font-size:13px; font-weight:330; line-height:1.5; }
  input[type="number"], input[type="text"] {
    width:100%; padding:10px 12px; border:1px solid var(--hairline); border-radius:var(--r-md);
    font-size:14px; font-family:'Pretendard', sans-serif; font-weight:400; background:var(--canvas); color:var(--ink);
  }
  input:focus { outline: none; box-shadow: 0 0 0 2px var(--ink); border-color: var(--ink); }
  button { font-family:'Pretendard', sans-serif; cursor:pointer; }
  table { border-collapse: collapse; width:100%; }
  th, td { border-bottom:1px solid var(--hairline-soft); padding:8px; font-size:13px; text-align:center; }
  th { font-family:'Pretendard', monospace; text-transform:uppercase; font-size:11px; font-weight:400; letter-spacing:0.4px; color:#55524a; border-bottom:1px solid var(--ink); }
  .card { background:var(--surface-soft); border:1px solid var(--hairline); border-radius:var(--r-md); }
  .block { border-radius:var(--r-lg); }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--hairline); border-radius:8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;

const C = {
  ink: "#000000", canvas: "#ffffff", hairline: "#e6e6e6", hairlineSoft: "#f1f1f1", surfaceSoft: "#f7f7f5",
  lime: "#dceeb1", lilac: "#c5b0f4", cream: "#f4ecd6", pink: "#efd4d4", mint: "#c8e6cd", coral: "#f3c9b6", navy: "#1f1d3d",
  magenta: "#ff3d8b", success: "#1ea64a",
};

if (window.pdfjsLib) {
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

/* ---------- PDF / 이미지 텍스트 → 치수 값 파싱 (베스트 에포트) ---------- */
const FIELD_SYNONYMS = {
  chest: ["가슴둘레", "가슴 둘레", "가슴", "chest", "bust"],
  totalLength: ["총기장", "총 기장", "기장", "total length", "length"],
  armholeDepth: ["진동길이", "진동 길이", "진동깊이", "진동", "armhole depth", "armhole"],
  shoulderWidth: ["어깨너비", "어깨 너비", "어깨넓이", "어깨", "shoulder width", "shoulder"],
  neckWidth: ["목너비", "목 너비", "목둘레", "neck width", "neck"],
  sleeveLength: ["소매길이", "소매 길이", "sleeve length"],
  sleeveCuff: ["소매밑단너비", "소매밑단", "소매 밑단", "cuff width", "cuff"],
  sleeveTop: ["소매산너비", "소매산", "소매 산", "sleeve cap"],
  raglanLine: ["래글런선", "래글런 선", "raglan line"],
  armholeBindOff: ["진동 덮어씌우기", "진동덮어씌우기", "armhole bind off"],
};

function parseMeasurementsFromText(text, fields) {
  const found = {};
  if (!text) return found;
  const lines = text.split(/\n+/);
  fields.forEach((f) => {
    const keys = FIELD_SYNONYMS[f.key] || [f.label];
    for (const rawLine of lines) {
      const line = rawLine.toLowerCase();
      const hit = keys.some((k) => line.includes(k.toLowerCase()));
      if (hit) {
        const nums = rawLine.match(/[0-9]+(\.[0-9]+)?/g);
        if (nums && nums.length) {
          found[f.key] = nums[0];
          break;
        }
      }
    }
  });
  return found;
}

/* ---------- 버튼 프리미티브 (design guide 기반) ---------- */
function PillButton({ children, onClick, variant, style, disabled }) {
  const base = {
    fontFamily: "'Pretendard', sans-serif", fontSize: 13, fontWeight: 480, letterSpacing: "-0.1px",
    borderRadius: 50, padding: "9px 18px", border: "none", cursor: disabled ? "default" : "pointer",
    opacity: disabled ? 0.4 : 1,
  };
  const variants = {
    primary: { background: C.ink, color: "#fff" },
    secondary: { background: C.canvas, color: C.ink, border: "1px solid " + C.hairline },
    selected: { background: C.ink, color: "#fff" },
    unselected: { background: C.canvas, color: C.ink, border: "1px solid " + C.hairline },
    magenta: { background: C.magenta, color: "#fff" },
  };
  return (
    <button disabled={disabled} onClick={onClick} style={{ ...base, ...(variants[variant] || variants.secondary), ...style }}>
      {children}
    </button>
  );
}
function IconButton({ children, onClick, inverse, style }) {
  return (
    <button onClick={onClick} style={{
      width: 36, height: 36, borderRadius: "50%", border: "none",
      background: inverse ? "rgba(255,255,255,0.16)" : C.surfaceSoft,
      color: inverse ? "#fff" : C.ink, fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center",
      ...style,
    }}>{children}</button>
  );
}

/* ---------- 도안 계산기 데이터 정의 ---------- */
const CONSTRUCTIONS = [
  { id: "raglan", label: "래글런" },
  { id: "setin", label: "셋인 슬리브" },
  { id: "drop", label: "드롭숄더" },
];

const COMMON_FIELDS = [
  { key: "chest", label: "가슴둘레", unit: "sts", cmLabel: "가슴둘레(cm)", axis: "h" },
  { key: "totalLength", label: "총기장", unit: "rows", cmLabel: "총기장(cm)", axis: "v" },
  { key: "armholeDepth", label: "진동길이", unit: "rows", cmLabel: "진동길이(cm)", axis: "v" },
  { key: "shoulderWidth", label: "어깨너비", unit: "sts", cmLabel: "어깨너비(cm)", axis: "h" },
  { key: "neckWidth", label: "목너비", unit: "sts", cmLabel: "목너비(cm)", axis: "h" },
  { key: "sleeveLength", label: "소매길이", unit: "rows", cmLabel: "소매길이(cm)", axis: "v" },
  { key: "sleeveCuff", label: "소매밑단너비", unit: "sts", cmLabel: "소매밑단너비(cm)", axis: "h" },
  { key: "sleeveTop", label: "소매산너비", unit: "sts", cmLabel: "소매산너비(cm)", axis: "h" },
];

const EXTRA_FIELDS = {
  raglan: [{ key: "raglanLine", label: "래글런선 길이", unit: "rows", cmLabel: "래글런선 길이(cm)", axis: "v" }],
  setin: [{ key: "armholeBindOff", label: "진동 덮어씌우기", unit: "sts", cmLabel: "진동 덮어씌우기 폭(cm)", axis: "h" }],
  drop: [],
};

function fieldsFor(construction) {
  return [...COMMON_FIELDS, ...(EXTRA_FIELDS[construction] || [])];
}

function roundEven(n) {
  const r = Math.round(n);
  return r % 2 === 0 ? r : r + (r > n ? -1 : 1);
}
function toStitchCount(n, useEven) {
  return useEven ? roundEven(n) : Math.round(n);
}
function snapToRepeat(n, repeat) {
  const r = Number(repeat);
  if (!r || r <= 0) return n;
  return Math.round(n / r) * r;
}
function densityOf(gauge, axis) {
  if (axis === "h") {
    const len = Number(gauge.stitchBaseLength) || 10;
    const cnt = Number(gauge.stitchCount) || 0;
    return len > 0 ? cnt / len : 0;
  } else {
    const len = Number(gauge.rowBaseLength) || 10;
    const cnt = Number(gauge.rowCount) || 0;
    return len > 0 ? cnt / len : 0;
  }
}

let idSeq = 1;
function nextId() { return "id" + (idSeq++) + "_" + Math.random().toString(36).slice(2, 7); }

const TARGET_FIELDS = [
  { key: "chest", label: "가슴둘레", axis: "h", unit: "sts" },
  { key: "totalLength", label: "총기장", axis: "v", unit: "rows" },
  { key: "armholeDepth", label: "진동길이", axis: "v", unit: "rows" },
];
function cmFromCount(count, axis, gauge) {
  const density = densityOf(gauge, axis);
  return density > 0 ? count / density : 0;
}
function countFromCm(cm, axis, gauge, unit, useEven) {
  const density = densityOf(gauge, axis);
  const raw = cm * density;
  return unit === "sts" ? toStitchCount(raw, useEven) : Math.round(raw);
}

function emptyGauge() {
  return { stitchCount: "", stitchBaseLength: "10", rowCount: "", rowBaseLength: "10" };
}
function emptySize(name) {
  return { id: nextId(), name: name || "Size", values: {} };
}

function Field({ label, children }) {
  return (
    <div>
      <div className="caption" style={{ marginBottom: 6 }}>{label}</div>
      {children}
    </div>
  );
}

function GaugeInput({ label, gauge, onChange }) {
  const set = (key) => (e) => onChange({ ...gauge, [key]: e.target.value });
  return (
    <div>
      <div className="card-title" style={{ fontSize: 14, marginBottom: 10 }}>{label}</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="콧수 (가로)"><input type="number" value={gauge.stitchCount} onChange={set("stitchCount")} placeholder="예: 20" /></Field>
        <Field label="기준 길이(cm)"><input type="number" value={gauge.stitchBaseLength} onChange={set("stitchBaseLength")} placeholder="예: 10" /></Field>
        <Field label="단수 (세로)"><input type="number" value={gauge.rowCount} onChange={set("rowCount")} placeholder="예: 28" /></Field>
        <Field label="기준 길이(cm)"><input type="number" value={gauge.rowBaseLength} onChange={set("rowBaseLength")} placeholder="예: 10" /></Field>
      </div>
    </div>
  );
}

function ScanImportPanel({ sizes, fields, onApply, onClose }) {
  const [targetId, setTargetId] = useState(sizes[0] ? sizes[0].id : "");
  const [extractedText, setExtractedText] = useState("");
  const [status, setStatus] = useState("");
  const [foundPreview, setFoundPreview] = useState(null);
  const pdfInputRef = useRef(null);
  const imgInputRef = useRef(null);

  useEffect(() => {
    if (!sizes.find((s) => s.id === targetId) && sizes[0]) setTargetId(sizes[0].id);
  }, [sizes]);

  async function handlePdf(e) {
    const file = e.target.files[0];
    if (!file) return;
    setStatus("PDF 읽는 중...");
    setFoundPreview(null);
    try {
      const buf = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
      let fullText = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map((it) => it.str).join(" ") + "\n";
      }
      setExtractedText(fullText.trim());
      setStatus("추출 완료. 아래 텍스트를 확인한 뒤 자동 채우기를 시도하세요.");
    } catch (err) {
      setStatus("PDF를 읽는 중 오류가 발생했습니다. 텍스트가 포함된 PDF인지 확인해주세요.");
    }
    e.target.value = "";
  }

  async function handleImage(e) {
    const file = e.target.files[0];
    if (!file) return;
    setStatus("이미지 인식 중... (0%)");
    setFoundPreview(null);
    try {
      const result = await window.Tesseract.recognize(file, "kor+eng", {
        logger: (m) => {
          if (m.status === "recognizing text") setStatus("이미지 인식 중... (" + Math.round((m.progress || 0) * 100) + "%)");
        },
      });
      setExtractedText((result.data.text || "").trim());
      setStatus("인식 완료. 아래 텍스트를 확인한 뒤 자동 채우기를 시도하세요.");
    } catch (err) {
      setStatus("이미지 인식 중 오류가 발생했습니다.");
    }
    e.target.value = "";
  }

  function tryAutoFill() {
    setFoundPreview(parseMeasurementsFromText(extractedText, fields));
  }
  function applyValues() {
    if (!foundPreview || !targetId) return;
    onApply(targetId, foundPreview);
    setStatus("선택한 사이즈에 값을 채웠습니다. 아래 표에서 다시 한 번 확인해주세요.");
  }

  return (
    <div style={{ border: "1px solid " + C.hairline, borderRadius: 8, padding: 16, marginBottom: 16, background: "#fff" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <div className="card-title" style={{ fontSize: 14 }}>PDF / 이미지로 자동 입력</div>
        <PillButton variant="secondary" style={{ padding: "5px 12px", fontSize: 11 }} onClick={onClose}>닫기</PillButton>
      </div>

      <div style={{ marginBottom: 12, maxWidth: 260 }}>
        <Field label="채워 넣을 사이즈">
          <select value={targetId} onChange={(e) => setTargetId(e.target.value)}
            style={{ width: "100%", padding: "10px 12px", border: "1px solid " + C.hairline, borderRadius: 8, fontSize: 14, background: "#fff" }}>
            {sizes.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </Field>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
        <PillButton variant="secondary" onClick={() => pdfInputRef.current.click()}>기존 도안 PDF 업로드</PillButton>
        <input ref={pdfInputRef} type="file" accept="application/pdf" style={{ display: "none" }} onChange={handlePdf} />
        <PillButton variant="secondary" onClick={() => imgInputRef.current.click()}>기성품 사이즈 이미지 업로드</PillButton>
        <input ref={imgInputRef} type="file" accept="image/*" style={{ display: "none" }} onChange={handleImage} />
      </div>

      {status && <div className="body-sm" style={{ marginBottom: 10, color: "#55524a" }}>{status}</div>}

      {extractedText && (
        <div style={{ marginBottom: 12 }}>
          <div className="caption" style={{ marginBottom: 6 }}>추출된 텍스트 (수정 가능)</div>
          <textarea value={extractedText} onChange={(e) => setExtractedText(e.target.value)}
            style={{ width: "100%", minHeight: 100, padding: 10, border: "1px solid " + C.hairline, borderRadius: 8, fontSize: 12, fontFamily: "'Pretendard', monospace" }} />
          <div style={{ marginTop: 8 }}>
            <PillButton variant="primary" onClick={tryAutoFill}>자동 채우기 시도</PillButton>
          </div>
        </div>
      )}

      {foundPreview && (
        <div style={{ background: C.surfaceSoft, borderRadius: 8, padding: 12 }}>
          <div className="caption" style={{ marginBottom: 8 }}>인식된 값 (적용 전 확인)</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, fontSize: 13, marginBottom: 10 }}>
            {fields.map((f) => (
              <div key={f.key} style={{ display: "flex", justifyContent: "space-between", borderBottom: "1px solid " + C.hairlineSoft, padding: "4px 0" }}>
                <span>{f.label}</span>
                <span style={{ fontWeight: 600 }}>{foundPreview[f.key] ?? "—"}</span>
              </div>
            ))}
          </div>
          <PillButton variant="primary" onClick={applyValues}>선택한 사이즈에 적용</PillButton>
        </div>
      )}

      <div className="caption" style={{ marginTop: 12, textTransform: "none", fontSize: 11, color: "#8a8474" }}>
        PDF/이미지 인식은 완벽하지 않을 수 있어요. 적용 후 표에서 값을 다시 한 번 확인해주세요. 문서가 실제 콧수/단수인지, 실측 cm인지에 맞춰 위쪽의 계산 모드(기준 도안 스케일링 / 신체 치수 기반)를 선택해주세요.
      </div>
    </div>
  );
}

function TargetGoalsCard({ sizes, myGauge, useEven, onCmChange, onCountChange }) {
  return (
    <div className="card" style={{ padding: 20, marginBottom: 20, overflowX: "auto" }}>
      <div className="card-title" style={{ marginBottom: 4 }}>사이즈별 목표 치수 (cm ↔ 콧수/단수)</div>
      <div className="caption" style={{ marginBottom: 14, textTransform: "none", fontSize: 11, color: "#8a8474" }}>
        참고 도안이나 기성품 실측 cm를 사이즈별로 넣으면 내 게이지 기준 콧수/단수가 바로 뜨고, 이전 사이즈 대비 몇 % 커지는지도 자동으로 같이 표시돼요.
      </div>
      <table>
        <thead>
          <tr>
            <th style={{ minWidth: 120 }}>사이즈</th>
            {TARGET_FIELDS.map((f) => (
              <React.Fragment key={f.key}>
                <th style={{ minWidth: 100 }}>{f.label} (cm)</th>
                <th style={{ minWidth: 100 }}>{f.label} ({f.unit === "sts" ? "콧수" : "단수"})</th>
              </React.Fragment>
            ))}
          </tr>
        </thead>
        <tbody>
          {sizes.map((s, i) => (
            <tr key={s.id}>
              <td>{s.name}</td>
              {TARGET_FIELDS.map((f) => {
                const cmVal = s.values["goal_" + f.key + "_cm"] ?? "";
                const countVal = s.values["goal_" + f.key + "_count"] ?? "";
                let cmPct = null, countPct = null;
                if (i > 0) {
                  const prevCm = Number(sizes[i - 1].values["goal_" + f.key + "_cm"]);
                  const prevCount = Number(sizes[i - 1].values["goal_" + f.key + "_count"]);
                  const curCm = Number(cmVal), curCount = Number(countVal);
                  if (cmVal !== "" && prevCm) cmPct = ((curCm - prevCm) / prevCm) * 100;
                  if (countVal !== "" && prevCount) countPct = ((curCount - prevCount) / prevCount) * 100;
                }
                return (
                  <React.Fragment key={f.key}>
                    <td>
                      <input type="number" value={cmVal}
                        onChange={(e) => onCmChange(s.id, f, e.target.value)} placeholder="cm" />
                      {cmPct !== null && (
                        <div style={{ fontSize: 10, marginTop: 3, color: cmPct >= 0 ? "#1a6b3a" : "#a8412a" }}>
                          {cmPct >= 0 ? "+" : ""}{cmPct.toFixed(1)}%
                        </div>
                      )}
                    </td>
                    <td>
                      <input type="number" value={countVal}
                        onChange={(e) => onCountChange(s.id, f, e.target.value)} placeholder={f.unit === "sts" ? "콧수" : "단수"} />
                      {countPct !== null && (
                        <div style={{ fontSize: 10, marginTop: 3, color: countPct >= 0 ? "#1a6b3a" : "#a8412a" }}>
                          {countPct >= 0 ? "+" : ""}{countPct.toFixed(1)}%
                        </div>
                      )}
                    </td>
                  </React.Fragment>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}


function App() {
  const [patternName, setPatternName] = useState("");
  const [construction, setConstruction] = useState("raglan");
  const [mode, setMode] = useState("A");
  const [baseGauge, setBaseGauge] = useState(emptyGauge());
  const [targetGauge, setTargetGauge] = useState(emptyGauge());
  const [gaugeB, setGaugeB] = useState(emptyGauge());
  const [ease, setEase] = useState("0");
  const [useEven, setUseEven] = useState(true);
  const [repeat, setRepeat] = useState("");
  const [sizes, setSizes] = useState([emptySize("Size 1")]);
  const [activeTab, setActiveTab] = useState("calc");
  const [scanOpen, setScanOpen] = useState(false);
  const [quickValue, setQuickValue] = useState("");
  const [quickUnit, setQuickUnit] = useState("sts");
  const [quickCmValue, setQuickCmValue] = useState("");
  const [quickCmUnit, setQuickCmUnit] = useState("sts");
  const fileInputRef = useRef(null);

  const fields = fieldsFor(construction);

  function updateSizeValue(id, key, val) {
    setSizes((prev) => prev.map((s) => {
      if (s.id !== id) return s;
      const newValues = { ...s.values, [key]: val };
      if (mode === "B") {
        const f = TARGET_FIELDS.find((tf) => tf.key === key);
        if (f) {
          newValues["goal_" + key + "_cm"] = val;
          newValues["goal_" + key + "_count"] = val === "" ? "" : String(countFromCm(Number(val) || 0, f.axis, gaugeB, f.unit, useEven));
        }
      }
      return { ...s, values: newValues };
    }));
  }
  function updateSizeName(id, name) {
    setSizes((prev) => prev.map((s) => (s.id === id ? { ...s, name } : s)));
  }
  function addSize() {
    setSizes((prev) => [...prev, emptySize("Size " + (prev.length + 1))]);
  }
  function duplicateSize(id) {
    setSizes((prev) => {
      const src = prev.find((s) => s.id === id);
      if (!src) return prev;
      const copy = { id: nextId(), name: src.name + " 복사", values: { ...src.values } };
      const idx = prev.findIndex((s) => s.id === id);
      const next = [...prev];
      next.splice(idx + 1, 0, copy);
      return next;
    });
  }
  function removeSize(id) {
    setSizes((prev) => (prev.length > 1 ? prev.filter((s) => s.id !== id) : prev));
  }

  const myGauge = mode === "A" ? targetGauge : gaugeB;

  function handleGoalCmChange(sizeId, field, val) {
    const cmNum = Number(val) || 0;
    const countVal = val === "" ? "" : String(countFromCm(cmNum, field.axis, myGauge, field.unit, useEven));
    const isSynced = mode === "B" && ["chest", "totalLength", "armholeDepth"].includes(field.key);
    setSizes((prev) => prev.map((s) => {
      if (s.id !== sizeId) return s;
      const newValues = { ...s.values, ["goal_" + field.key + "_cm"]: val, ["goal_" + field.key + "_count"]: countVal };
      if (isSynced) newValues[field.key] = val;
      return { ...s, values: newValues };
    }));
  }
  function handleGoalCountChange(sizeId, field, val) {
    const countNum = Number(val) || 0;
    const cmVal = val === "" ? "" : String(Math.round(cmFromCount(countNum, field.axis, myGauge) * 10) / 10);
    const isSynced = mode === "B" && ["chest", "totalLength", "armholeDepth"].includes(field.key);
    setSizes((prev) => prev.map((s) => {
      if (s.id !== sizeId) return s;
      const newValues = { ...s.values, ["goal_" + field.key + "_count"]: val, ["goal_" + field.key + "_cm"]: cmVal };
      if (isSynced) newValues[field.key] = cmVal;
      return { ...s, values: newValues };
    }));
  }

  const quickResult = useMemo(() => {
    const raw = Number(quickValue);
    if (!quickValue || (!raw && raw !== 0)) return "";
    const axis = quickUnit === "sts" ? "h" : "v";
    const baseDensity = densityOf(baseGauge, axis);
    const targetDensity = densityOf(targetGauge, axis);
    const cm = baseDensity > 0 ? raw / baseDensity : 0;
    const newVal = cm * targetDensity;
    return quickUnit === "sts" ? toStitchCount(newVal, useEven) : Math.round(newVal);
  }, [quickValue, quickUnit, baseGauge, targetGauge, useEven]);

  const quickCmResult = useMemo(() => {
    const raw = Number(quickCmValue);
    if (!quickCmValue || (!raw && raw !== 0)) return "";
    const axis = quickCmUnit === "sts" ? "h" : "v";
    return countFromCm(raw, axis, myGauge, quickCmUnit, useEven);
  }, [quickCmValue, quickCmUnit, myGauge, useEven]);

  const results = useMemo(() => {
    return sizes.map((size) => {
      const out = { id: size.id, name: size.name, values: {} };
      fields.forEach((f) => {
        const raw = Number(size.values[f.key]);
        if (!raw && raw !== 0) { out.values[f.key] = ""; return; }
        let cm, newVal;
        if (mode === "A") {
          const baseDensity = densityOf(baseGauge, f.axis);
          const targetDensity = densityOf(targetGauge, f.axis);
          cm = baseDensity > 0 ? raw / baseDensity : 0;
          newVal = cm * targetDensity;
        } else {
          const density = densityOf(gaugeB, f.axis);
          cm = raw + (f.key === "chest" ? Number(ease || 0) : 0);
          newVal = cm * density;
        }
        if (f.unit === "sts") {
          let v = toStitchCount(newVal, useEven);
          if (f.key === "chest" && repeat) v = snapToRepeat(v, repeat);
          out.values[f.key] = v;
        } else {
          out.values[f.key] = Math.round(newVal);
        }
      });
      return out;
    });
  }, [sizes, fields, mode, baseGauge, targetGauge, gaugeB, ease, useEven, repeat]);

  function copyResults() {
    const header = ["Size", ...fields.map((f) => f.label)].join("\t");
    const rows = results.map((r) => [r.name, ...fields.map((f) => r.values[f.key] ?? "")].join("\t"));
    const text = [header, ...rows].join("\n");
    navigator.clipboard.writeText(text).then(() => alert("결과가 클립보드에 복사되었습니다. 구글시트에 붙여넣기 하세요."));
  }

  function exportExcel() {
    if (!window.XLSX) { alert("엑셀 기능을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해주세요."); return; }
    const header = [
      "사이즈",
      ...fields.map((f) => (mode === "A" ? f.label : f.cmLabel) + " (입력)"),
      ...fields.map((f) => f.label + " (" + (f.unit === "sts" ? "콧수" : "단수") + ", 결과)"),
    ];
    const rows = sizes.map((s, i) => [
      s.name,
      ...fields.map((f) => s.values[f.key] ?? ""),
      ...fields.map((f) => results[i].values[f.key] ?? ""),
    ]);
    const infoRows = [
      ["도안 이름", patternName || ""],
      ["구성", (CONSTRUCTIONS.find((c) => c.id === construction) || {}).label || construction],
      ["계산 모드", mode === "A" ? "기준 도안 스케일링" : "신체 치수 기반"],
    ];
    if (mode === "A") {
      infoRows.push(
        ["기준 도안 게이지 - 콧수", baseGauge.stitchCount], ["기준 도안 게이지 - 콧수 기준길이(cm)", baseGauge.stitchBaseLength],
        ["기준 도안 게이지 - 단수", baseGauge.rowCount], ["기준 도안 게이지 - 단수 기준길이(cm)", baseGauge.rowBaseLength],
        ["내 게이지 - 콧수", targetGauge.stitchCount], ["내 게이지 - 콧수 기준길이(cm)", targetGauge.stitchBaseLength],
        ["내 게이지 - 단수", targetGauge.rowCount], ["내 게이지 - 단수 기준길이(cm)", targetGauge.rowBaseLength]
      );
    } else {
      infoRows.push(
        ["내 게이지 - 콧수", gaugeB.stitchCount], ["내 게이지 - 콧수 기준길이(cm)", gaugeB.stitchBaseLength],
        ["내 게이지 - 단수", gaugeB.rowCount], ["내 게이지 - 단수 기준길이(cm)", gaugeB.rowBaseLength],
        ["여유분(cm)", ease]
      );
    }
    infoRows.push(["짝수 반올림", useEven ? "예" : "아니오"], ["패턴 반복수", repeat || ""]);

    const wsInfo = XLSX.utils.aoa_to_sheet(infoRows);
    const wsData = XLSX.utils.aoa_to_sheet([header, ...rows]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, wsInfo, "도안 정보");
    XLSX.utils.book_append_sheet(wb, wsData, "사이즈별 계산");
    XLSX.writeFile(wb, (patternName || "pattern") + ".xlsx");
  }

  function saveJSON() {
    const data = {
      patternName, construction, mode, baseGauge, targetGauge, gaugeB, ease, useEven, repeat,
      sizes: sizes.map((s) => ({ name: s.name, values: s.values })),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (patternName || "pattern") + ".json";
    a.click();
    URL.revokeObjectURL(url);
  }

  function loadJSON(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        setPatternName(data.patternName || "");
        setConstruction(data.construction || "raglan");
        setMode(data.mode || "A");
        setBaseGauge(data.baseGauge || emptyGauge());
        setTargetGauge(data.targetGauge || emptyGauge());
        setGaugeB(data.gaugeB || emptyGauge());
        setEase(data.ease ?? "0");
        setUseEven(data.useEven ?? true);
        setRepeat(data.repeat || "");
        setSizes((data.sizes || []).map((s) => ({ id: nextId(), name: s.name, values: s.values || {} })));
      } catch (err) {
        alert("JSON 파일을 읽는 중 오류가 발생했습니다.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  function newPattern() {
    if (!confirm("현재 입력 내용을 지우고 새 도안을 시작할까요?")) return;
    setPatternName("");
    setBaseGauge(emptyGauge());
    setTargetGauge(emptyGauge());
    setGaugeB(emptyGauge());
    setEase("0");
    setRepeat("");
    setSizes([emptySize("Size 1")]);
  }

  return (
    <div style={{ maxWidth: 1080, margin: "0 auto", padding: "40px 24px 80px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 28, flexWrap: "wrap", gap: 16 }}>
        <div>
          <div className="eyebrow" style={{ marginBottom: 6 }}>Knit Pattern Tool</div>
          <div className="headline">게이지 도안 계산기</div>
          <div className="body-sm" style={{ color: "#55524a", marginTop: 4 }}>도안별 저장 · 게이지 자유 입력 · 저먼 숏로우 계산</div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <PillButton variant={activeTab === "calc" ? "selected" : "unselected"} onClick={() => setActiveTab("calc")}>계산기</PillButton>
          <PillButton variant={activeTab === "shortrow" ? "selected" : "unselected"} onClick={() => setActiveTab("shortrow")}>저먼 숏로우</PillButton>
        </div>
      </div>

      {activeTab === "calc" && (
        <React.Fragment>
          <div className="card" style={{ padding: 20, marginBottom: 20, display: "flex", gap: 12, alignItems: "flex-end", flexWrap: "wrap" }}>
            <div style={{ flex: 1, minWidth: 200 }}>
              <Field label="도안 이름"><input type="text" value={patternName} onChange={(e) => setPatternName(e.target.value)} placeholder="예: 브라보 풀오버" /></Field>
            </div>
            <PillButton variant="primary" onClick={saveJSON}>설정 저장 (JSON)</PillButton>
            <PillButton variant="secondary" onClick={() => fileInputRef.current.click()}>설정 불러오기</PillButton>
            <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={loadJSON} />
            <PillButton variant="secondary" onClick={newPattern}>새 도안</PillButton>
          </div>

          <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap", alignItems: "center" }}>
            {CONSTRUCTIONS.map((c) => (
              <PillButton key={c.id} variant={construction === c.id ? "selected" : "unselected"} onClick={() => setConstruction(c.id)}>{c.label}</PillButton>
            ))}
            <div style={{ width: 1, alignSelf: "stretch", background: C.hairline, margin: "0 8px" }} />
            <PillButton variant={mode === "A" ? "selected" : "unselected"} onClick={() => setMode("A")}>기준 도안 스케일링</PillButton>
            <PillButton variant={mode === "B" ? "selected" : "unselected"} onClick={() => setMode("B")}>신체 치수 기반</PillButton>
          </div>

          <div className="card" style={{ padding: 20, marginBottom: 20 }}>
            {mode === "A" ? (
              <div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 }}>
                  <GaugeInput label="기준 도안 게이지" gauge={baseGauge} onChange={setBaseGauge} />
                  <GaugeInput label="내 게이지" gauge={targetGauge} onChange={setTargetGauge} />
                </div>
                <div style={{ background: C.surfaceSoft, borderRadius: 8, padding: 14, marginTop: 18 }}>
                  <div className="card-title" style={{ fontSize: 13, marginBottom: 10 }}>빠른 환산 (참고 도안 콧수/단수 → 내 게이지)</div>
                  <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                    <PillButton variant={quickUnit === "sts" ? "selected" : "unselected"} style={{ padding: "7px 14px", fontSize: 12 }} onClick={() => setQuickUnit("sts")}>콧수</PillButton>
                    <PillButton variant={quickUnit === "rows" ? "selected" : "unselected"} style={{ padding: "7px 14px", fontSize: 12 }} onClick={() => setQuickUnit("rows")}>단수</PillButton>
                    <input type="number" value={quickValue} onChange={(e) => setQuickValue(e.target.value)} placeholder="참고 도안 값 (예: 45)" style={{ width: 160 }} />
                    <span style={{ fontSize: 14 }}>→</span>
                    <span style={{ fontSize: 20, fontWeight: 700 }}>{quickResult === "" ? "-" : quickResult}</span>
                    <span style={{ fontSize: 13, color: "#55524a" }}>{quickUnit === "sts" ? "콧수" : "단수"} (내 게이지 기준)</span>
                  </div>
                </div>
              </div>
            ) : (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 }}>
                <GaugeInput label="내 게이지" gauge={gaugeB} onChange={setGaugeB} />
                <Field label="여유분 (cm, 가슴둘레에 적용)"><input type="number" value={ease} onChange={(e) => setEase(e.target.value)} /></Field>
              </div>
            )}

            <div style={{ background: C.mint, borderRadius: 8, padding: 14, marginTop: 18 }}>
              <div className="card-title" style={{ fontSize: 13, marginBottom: 10 }}>빠른 환산 (cm → 콧수/단수)</div>
              <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                <PillButton variant={quickCmUnit === "sts" ? "selected" : "unselected"} style={{ padding: "7px 14px", fontSize: 12 }} onClick={() => setQuickCmUnit("sts")}>콧수</PillButton>
                <PillButton variant={quickCmUnit === "rows" ? "selected" : "unselected"} style={{ padding: "7px 14px", fontSize: 12 }} onClick={() => setQuickCmUnit("rows")}>단수</PillButton>
                <input type="number" value={quickCmValue} onChange={(e) => setQuickCmValue(e.target.value)} placeholder="원하는 길이 (cm, 예: 50)" style={{ width: 170 }} />
                <span style={{ fontSize: 14 }}>→</span>
                <span style={{ fontSize: 20, fontWeight: 700 }}>{quickCmResult === "" ? "-" : quickCmResult}</span>
                <span style={{ fontSize: 13, color: "#55524a" }}>{quickCmUnit === "sts" ? "콧수" : "단수"} (내 게이지 기준)</span>
              </div>
              <div className="caption" style={{ marginTop: 8, textTransform: "none", fontSize: 11, color: "#55524a" }}>
                전체 구조(가슴둘레·기장 등)를 cm로 먼저 정할 때 바로 콧수/단수로 확인해보는 용도예요.
              </div>
            </div>
            <div style={{ display: "flex", gap: 20, marginTop: 18, alignItems: "center", flexWrap: "wrap" }}>
              <label style={{ fontSize: 13, display: "flex", alignItems: "center", gap: 6 }}>
                <input type="checkbox" checked={useEven} onChange={(e) => setUseEven(e.target.checked)} style={{ width: "auto" }} />
                콧수 짝수로 반올림
              </label>
              <label style={{ fontSize: 13, display: "flex", alignItems: "center", gap: 6 }}>
                패턴 반복수(콧수, 가슴둘레에 적용)
                <input type="number" placeholder="예: 8" value={repeat} onChange={(e) => setRepeat(e.target.value)} style={{ width: 70 }} />
              </label>
            </div>
            <div className="caption" style={{ marginTop: 14, lineHeight: 1.7, textTransform: "none", fontSize: 11 }}>
              가로(콧수)와 세로(단수)는 서로 다른 측정 길이를 가질 수 있어 각각 따로 입력합니다.<br />
              {mode === "A" ? "아래 표에는 기준 도안의 실제 콧수/단수를 입력하세요." : "아래 표에는 원하는 신체 치수(cm)를 입력하세요."}
            </div>
          </div>

          <TargetGoalsCard sizes={sizes} myGauge={myGauge} useEven={useEven} onCmChange={handleGoalCmChange} onCountChange={handleGoalCountChange} />

          <div className="card" style={{ padding: 20, marginBottom: 20, overflowX: "auto" }}>
            <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: scanOpen ? 0 : 16 }}>
              <PillButton variant="secondary" onClick={() => setScanOpen((v) => !v)}>
                {scanOpen ? "자동 입력 패널 접기" : "PDF/이미지로 자동 입력"}
              </PillButton>
            </div>
            {scanOpen && (
              <ScanImportPanel
                sizes={sizes}
                fields={fields}
                onClose={() => setScanOpen(false)}
                onApply={(sizeId, values) => {
                  setSizes((prev) => prev.map((s) => (s.id === sizeId ? { ...s, values: { ...s.values, ...values } } : s)));
                }}
              />
            )}
            <table>
              <thead>
                <tr>
                  <th style={{ minWidth: 140 }}>사이즈</th>
                  {fields.map((f) => (
                    <th key={f.key}>
                      {mode === "A" ? f.label + " (" + (f.unit === "sts" ? "콧수" : "단수") + ")" : f.cmLabel}
                    </th>
                  ))}
                  <th style={{ minWidth: 110 }}>동작</th>
                </tr>
              </thead>
              <tbody>
                {sizes.map((s) => (
                  <tr key={s.id}>
                    <td><input type="text" value={s.name} onChange={(e) => updateSizeName(s.id, e.target.value)} /></td>
                    {fields.map((f) => (
                      <td key={f.key}>
                        <input type="number" value={s.values[f.key] ?? ""} onChange={(e) => updateSizeValue(s.id, f.key, e.target.value)} />
                      </td>
                    ))}
                    <td>
                      <div style={{ display: "flex", gap: 6, justifyContent: "center" }}>
                        <PillButton variant="secondary" style={{ padding: "5px 12px", fontSize: 11 }} onClick={() => duplicateSize(s.id)}>복제</PillButton>
                        <PillButton variant="secondary" style={{ padding: "5px 12px", fontSize: 11 }} onClick={() => removeSize(s.id)}>삭제</PillButton>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            <PillButton variant="primary" style={{ marginTop: 16 }} onClick={addSize}>+ 사이즈 추가</PillButton>
          </div>

          <div className="block" style={{ background: C.lime, padding: 32 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 }}>
              <div className="card-title">계산 결과</div>
              <div style={{ display: "flex", gap: 8 }}>
                <PillButton variant="secondary" onClick={copyResults}>결과 복사</PillButton>
                <PillButton variant="primary" onClick={exportExcel}>엑셀로 다운로드</PillButton>
              </div>
            </div>
            <table style={{ background: "transparent" }}>
              <thead>
                <tr>
                  <th style={{ borderBottom: "1px solid " + C.ink }}>사이즈</th>
                  {fields.map((f) => <th key={f.key} style={{ borderBottom: "1px solid " + C.ink }}>{f.label} ({f.unit === "sts" ? "콧수" : "단수"})</th>)}
                </tr>
              </thead>
              <tbody>
                {results.map((r, i) => (
                  <tr key={r.id}>
                    <td style={{ borderBottom: "1px solid rgba(0,0,0,0.15)" }}>{r.name}</td>
                    {fields.map((f) => {
                      const val = r.values[f.key];
                      let pct = null;
                      if (i > 0) {
                        const prevVal = results[i - 1].values[f.key];
                        if (typeof val === "number" && typeof prevVal === "number" && prevVal !== 0) {
                          pct = ((val - prevVal) / prevVal) * 100;
                        }
                      }
                      return (
                        <td key={f.key} style={{ borderBottom: "1px solid rgba(0,0,0,0.15)" }}>
                          <div>{val}</div>
                          {pct !== null && (
                            <div style={{ fontSize: 10, marginTop: 2, color: pct >= 0 ? "#1a6b3a" : "#a8412a" }}>
                              {pct >= 0 ? "+" : ""}{pct.toFixed(1)}% (이전 사이즈比)
                            </div>
                          )}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </React.Fragment>
      )}

      {activeTab === "shortrow" && <ShortRowCalculator />}

      <FloatingCalculator />
    </div>
  );
}

function ShortRowCalculator() {
  const [totalStitches, setTotalStitches] = useState("");
  const [turnsPerShoulder, setTurnsPerShoulder] = useState("");

  const result = useMemo(() => {
    const total = Number(totalStitches);
    const turns = Number(turnsPerShoulder);
    if (!total || !turns || turns <= 0) return null;

    const rightTotal = Math.ceil(total / 2);
    const leftTotal = Math.floor(total / 2);

    function distribute(sideTotal, n) {
      const base = Math.floor(sideTotal / n);
      const rem = sideTotal % n;
      const arr = [];
      for (let i = 0; i < n; i++) arr.push(base + (i < rem ? 1 : 0));
      return arr;
    }

    const rightSteps = distribute(rightTotal, turns);
    const leftSteps = distribute(leftTotal, turns);

    const rows = [];
    let cum = 0;
    for (let i = 0; i < turns; i++) {
      cum += rightSteps[i];
      rows.push({ turn: rows.length + 1, side: "오른쪽 어깨", face: "겉면(RS)", stitches: rightSteps[i], cum });
      cum += leftSteps[i];
      rows.push({ turn: rows.length + 1, side: "왼쪽 어깨", face: "안면(WS)", stitches: leftSteps[i], cum });
    }
    return { rightTotal, leftTotal, rows };
  }, [totalStitches, turnsPerShoulder]);

  return (
    <div className="block" style={{ background: C.lilac, padding: 32 }}>
      <div className="card-title" style={{ marginBottom: 16 }}>저먼 숏로우 어깨 경사뜨기 계산</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24, marginBottom: 6 }}>
        <Field label="어깨 전체 콧수 (양쪽 합)"><input type="number" value={totalStitches} onChange={(e) => setTotalStitches(e.target.value)} placeholder="예: 40" /></Field>
        <Field label="한쪽 어깨당 턴 수"><input type="number" value={turnsPerShoulder} onChange={(e) => setTurnsPerShoulder(e.target.value)} placeholder="예: 4" /></Field>
      </div>
      <div className="caption" style={{ marginTop: 12, lineHeight: 1.7, textTransform: "none", fontSize: 11 }}>
        전체 콧수가 홀수면 남는 1콧수는 오른쪽 어깨에 배정됩니다.<br />
        턴은 오른쪽(겉면) → 왼쪽(안면) 순서로 번갈아 진행됩니다.
      </div>

      {result && (
        <div style={{ background: "#fff", borderRadius: 8, padding: 16, marginTop: 20 }}>
          <div className="body-sm" style={{ marginBottom: 10 }}>
            오른쪽 어깨 총 {result.rightTotal}콧수 · 왼쪽 어깨 총 {result.leftTotal}콧수
          </div>
          <table>
            <thead>
              <tr><th>턴</th><th>어깨</th><th>면</th><th>이번 턴 콧수</th><th>누적 콧수</th></tr>
            </thead>
            <tbody>
              {result.rows.map((r) => (
                <tr key={r.turn}>
                  <td>{r.turn}</td><td>{r.side}</td><td>{r.face}</td><td>{r.stitches}</td><td>{r.cum}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ---------- 플로팅 계산기 (기록 저장/불러오기 포함) ---------- */
const HISTORY_STORAGE_KEY = "knitCalcHistoryV1";

function loadHistoryFromStorage() {
  try {
    const raw = window.localStorage.getItem(HISTORY_STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function FloatingCalculator() {
  const [open, setOpen] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const [display, setDisplay] = useState("0");
  const [previous, setPrevious] = useState(null);
  const [operator, setOperator] = useState(null);
  const [waitingForNew, setWaitingForNew] = useState(false);
  const [history, setHistory] = useState(() => loadHistoryFromStorage());
  const historyFileRef = useRef(null);

  useEffect(() => {
    try { window.localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history)); } catch (e) {}
  }, [history]);

  function compute(a, b, op) {
    switch (op) {
      case "+": return a + b;
      case "-": return a - b;
      case "×": return a * b;
      case "÷": return b === 0 ? 0 : a / b;
      default: return b;
    }
  }
  function formatResult(n) {
    if (!isFinite(n)) return "0";
    const rounded = Math.round(n * 1e8) / 1e8;
    return String(rounded);
  }
  function inputDigit(d) {
    if (waitingForNew) { setDisplay(d); setWaitingForNew(false); }
    else setDisplay(display === "0" ? d : display + d);
  }
  function inputDecimal() {
    if (waitingForNew) { setDisplay("0."); setWaitingForNew(false); return; }
    if (!display.includes(".")) setDisplay(display + ".");
  }
  function clearAll() {
    setDisplay("0"); setPrevious(null); setOperator(null); setWaitingForNew(false);
  }
  function backspace() {
    if (waitingForNew) return;
    setDisplay(display.length > 1 ? display.slice(0, -1) : "0");
  }
  function toggleSign() {
    setDisplay(formatResult(parseFloat(display) * -1));
  }
  function inputPercent() {
    setDisplay(formatResult(parseFloat(display) / 100));
  }
  function chooseOperator(nextOp) {
    const inputValue = parseFloat(display);
    if (previous == null) {
      setPrevious(inputValue);
    } else if (operator && !waitingForNew) {
      const result = compute(previous, inputValue, operator);
      setDisplay(formatResult(result));
      setPrevious(result);
    }
    setWaitingForNew(true);
    setOperator(nextOp);
  }
  function handleEquals() {
    if (operator == null || previous == null) return;
    const inputValue = parseFloat(display);
    const result = compute(previous, inputValue, operator);
    const expr = formatResult(previous) + " " + operator + " " + formatResult(inputValue);
    setHistory((prev) => [{ id: nextId(), expr, result: formatResult(result), ts: Date.now() }, ...prev].slice(0, 200));
    setDisplay(formatResult(result));
    setPrevious(null);
    setOperator(null);
    setWaitingForNew(true);
  }
  function reuseHistoryResult(item) {
    setDisplay(item.result);
    setPrevious(null);
    setOperator(null);
    setWaitingForNew(true);
  }
  function clearHistory() {
    if (!confirm("계산 기록을 모두 지울까요?")) return;
    setHistory([]);
  }
  function exportHistory() {
    const blob = new Blob([JSON.stringify(history, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "calc-history.json";
    a.click();
    URL.revokeObjectURL(url);
  }
  function importHistory(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (Array.isArray(data)) setHistory(data);
        else alert("올바른 기록 파일이 아닙니다.");
      } catch (err) {
        alert("파일을 읽는 중 오류가 발생했습니다.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  const calcBtnStyle = (opts) => ({
    padding: "12px 0", borderRadius: 8, border: "1px solid " + C.hairline, fontSize: 15, fontWeight: 480,
    background: opts && opts.accent ? C.ink : opts && opts.op ? C.surfaceSoft : "#fff",
    color: opts && opts.accent ? "#fff" : C.ink,
    gridColumn: opts && opts.wide ? "span 2" : "span 1",
    width: "100%",
  });
  const calcBtn = (label, onClick, opts) => (
    <button key={label} onClick={onClick} style={calcBtnStyle(opts)}>{label}</button>
  );

  if (!open) {
    return (
      <button
        onClick={() => setOpen(true)}
        title="계산기 열기"
        style={{
          position: "fixed", right: 20, bottom: 20, width: 52, height: 52, borderRadius: "50%",
          background: C.ink, color: "#fff", border: "none", fontSize: 20, boxShadow: "0 6px 18px rgba(0,0,0,0.25)",
          zIndex: 1000,
        }}
      >🧮</button>
    );
  }

  return (
    <div
      className="card"
      style={{
        position: "fixed", right: 20, bottom: 20, width: 240, padding: 14,
        boxShadow: "0 10px 28px rgba(0,0,0,0.2)", zIndex: 1000, background: "#fff",
      }}
    >
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <div className="caption">계산기</div>
        <div style={{ display: "flex", gap: 4 }}>
          <IconButton onClick={() => setShowHistory((v) => !v)} style={{ width: 28, height: 28, fontSize: 12 }}>🕘</IconButton>
          <IconButton onClick={() => setOpen(false)} style={{ width: 28, height: 28, fontSize: 12 }}>✕</IconButton>
        </div>
      </div>

      {showHistory ? (
        <div>
          <div style={{ maxHeight: 220, overflowY: "auto", border: "1px solid " + C.hairlineSoft, borderRadius: 8, marginBottom: 10 }}>
            {history.length === 0 ? (
              <div className="caption" style={{ padding: 12, textTransform: "none", color: "#8a8474" }}>저장된 계산 기록이 없습니다.</div>
            ) : history.map((h) => (
              <div key={h.id} onClick={() => reuseHistoryResult(h)}
                style={{ padding: "8px 10px", borderBottom: "1px solid " + C.hairlineSoft, cursor: "pointer" }}>
                <div style={{ fontSize: 11, color: "#8a8474" }}>{h.expr} =</div>
                <div style={{ fontSize: 15, fontWeight: 600 }}>{h.result}</div>
              </div>
            ))}
          </div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            <PillButton variant="secondary" style={{ fontSize: 11, padding: "6px 10px" }} onClick={exportHistory}>내보내기</PillButton>
            <PillButton variant="secondary" style={{ fontSize: 11, padding: "6px 10px" }} onClick={() => historyFileRef.current.click()}>가져오기</PillButton>
            <PillButton variant="secondary" style={{ fontSize: 11, padding: "6px 10px" }} onClick={clearHistory}>기록 지우기</PillButton>
            <input ref={historyFileRef} type="file" accept="application/json" style={{ display: "none" }} onChange={importHistory} />
          </div>
        </div>
      ) : (
        <React.Fragment>
          <div style={{
            textAlign: "right", fontSize: 22, fontWeight: 600, padding: "10px 8px", marginBottom: 8,
            background: C.surfaceSoft, borderRadius: 8, overflowX: "auto", whiteSpace: "nowrap",
          }}>{display}</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6 }}>
            {calcBtn("C", clearAll)}
            {calcBtn("±", toggleSign)}
            {calcBtn("%", inputPercent)}
            {calcBtn("÷", () => chooseOperator("÷"), { op: true })}
            {calcBtn("7", () => inputDigit("7"))}
            {calcBtn("8", () => inputDigit("8"))}
            {calcBtn("9", () => inputDigit("9"))}
            {calcBtn("×", () => chooseOperator("×"), { op: true })}
            {calcBtn("4", () => inputDigit("4"))}
            {calcBtn("5", () => inputDigit("5"))}
            {calcBtn("6", () => inputDigit("6"))}
            {calcBtn("-", () => chooseOperator("-"), { op: true })}
            {calcBtn("1", () => inputDigit("1"))}
            {calcBtn("2", () => inputDigit("2"))}
            {calcBtn("3", () => inputDigit("3"))}
            {calcBtn("+", () => chooseOperator("+"), { op: true })}
            {calcBtn("0", () => inputDigit("0"), { wide: true })}
            {calcBtn(".", inputDecimal)}
            {calcBtn("⌫", backspace)}
            <div style={{ gridColumn: "span 4" }}>{calcBtn("=", handleEquals, { accent: true })}</div>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
